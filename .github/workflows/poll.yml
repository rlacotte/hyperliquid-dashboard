# Collecte de secours, déclenchée À LA MAIN uniquement.
#
# Le déclencheur principal est une Scaleway Serverless Function appelée chaque
# minute par un CRON (cf. infra/scaleway-pinger/). Ce workflow l'a précédé et a
# été déclassé après mesure : sur 1 000 déclenchements planifiés (juillet →
# septembre 2026), le cron GitHub demandé toutes les 5 min a tiré avec un écart
# médian de 53 min et jusqu'à 12,5 h — 6 % de couverture effective. GitHub
# désactive en outre les workflows planifiés après 60 jours sans activité sur le
# dépôt (collecte arrêtée six semaines sans bruit). Et un cron permanent de
# service de production n'est pas l'usage prévu de GitHub Actions.
#
# Usage : onglet Actions → poll-hyperliquid → Run workflow, si la fonction
# Scaleway est en panne. Collecte chaque minute pendant la durée choisie. La
# route serveur écarte d'elle-même les doublons (< 40 s), il n'y a donc aucun
# risque à le lancer pendant que la fonction tourne.
#
# Prérequis — deux secrets de dépôt :
#   DASHBOARD_URL : https://<projet>.vercel.app
#   CRON_SECRET   : identique à la variable d'environnement Vercel
name: poll-hyperliquid

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de collecte (minutes, max 340)"
        default: "60"
        required: true

concurrency:
  group: poll-hyperliquid
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Collecte chaque minute
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -u
          minutes=$(( MINUTES > 340 ? 340 : MINUTES ))
          deadline=$(( $(date +%s) + minutes * 60 ))
          i=0; ok=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            started=$(date +%s)
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "X-Pinger: github-manual:${GITHUB_RUN_ID}:${i}" \
              "${DASHBOARD_URL}/api/cron/poll" || echo "000")
            [ "$code" = "200" ] && ok=$((ok + 1))
            echo "cycle $i -> HTTP $code $(head -c 160 /tmp/out.json 2>/dev/null || true)"
            elapsed=$(( $(date +%s) - started ))
            wait=$(( 60 - elapsed ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
          echo "terminé : $ok/$i cycles réussis"
          if [ "$ok" -eq 0 ]; then exit 1; fi
