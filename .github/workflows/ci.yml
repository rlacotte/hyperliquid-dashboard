# Tests backend + build frontend, sur chaque push et PR.
#
# Aucune base n'est nécessaire : les tests remplacent les écritures `db` par des
# espions (cf. backend/tests/conftest.py). DATABASE_URL est juste lue à l'import
# de la configuration.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests/ -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # `npm run build` lance tsc avant vite : le typage est vérifié ici aussi.
      - run: npm run build
        working-directory: frontend
